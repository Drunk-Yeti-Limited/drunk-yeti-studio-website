# Both handlers authenticate in code: checkout validates the user with Supabase
# Auth and scoped RPCs; webhook verifies Stripe's signed raw request body.
[functions.shard-checkout]
verify_jwt = false
[functions.shard-webhook]
verify_jwt = false

# Validates Supabase user JWT and RPC scopes inside the handler.
[functions.subscription-account]
verify_jwt = false
